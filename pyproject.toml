[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssp"
version = "0.1.0"
description = "Validity of simulated scanner shift as a proxy for real cross-vendor failure (M&Ms cardiac MRI)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyyaml", "nibabel", "matplotlib"]

[project.optional-dependencies]
# Needed for training, evaluation and corruptions. Not needed for analysis.
train = ["torch", "monai", "torchio", "kagglehub"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny model on mock data (needs torch, monai, torchio)"]
